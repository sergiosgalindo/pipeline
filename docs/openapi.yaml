openapi: 3.1.0
info:
  title: Library Assistant API
  version: 1.0.0
  description: >-
    FastAPI interface for semantic retrieval of library policies and grounded
    answer generation through Groq.
servers:
  - url: http://127.0.0.1:8000
    description: Local development
paths:
  /api/health:
    get:
      operationId: getHealth
      summary: Check application status
      description: The configured flag checks presence of GROQ_API_KEY only; it does not call providers.
      tags: [system]
      responses:
        '200':
          description: Application process is responding.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
              example:
                ok: true
                configured: true
  /api/chat:
    post:
      operationId: createChatCompletion
      summary: Ask about library policies
      description: >-
        Retrieves policy context using multilingual sentence embeddings and
        generates a grounded answer with Groq. If no context meets the configured
        similarity threshold, returns a fixed out-of-scope answer without calling Groq.
      tags: [chat]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChatRequest'
            example:
              message: How long can I borrow a book?
              history: []
      responses:
        '200':
          description: Answer and retrieved policy source titles.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChatResponse'
              example:
                answer: Check the loan policy for the applicable borrowing period.
                sources: [Loan and renewal]
        '422':
          description: Request validation error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
        '500':
          description: Knowledge base or retrieval configuration error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPError'
        '502':
          description: Groq provider rejected the request or was unreachable.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPError'
        '503':
          description: Embeddings unavailable or Groq API key missing.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPError'
components:
  schemas:
    ChatMessage:
      type: object
      additionalProperties: false
      required: [role, content]
      properties:
        role:
          type: string
          enum: [user, assistant]
        content:
          type: string
          maxLength: 2000
    ChatRequest:
      type: object
      additionalProperties: false
      required: [message]
      properties:
        message:
          type: string
          minLength: 1
          maxLength: 2000
        history:
          type: array
          maxItems: 12
          default: []
          items:
            $ref: '#/components/schemas/ChatMessage'
    ChatResponse:
      type: object
      required: [answer, sources]
      properties:
        answer:
          type: string
        sources:
          type: array
          items:
            type: string
    HealthResponse:
      type: object
      required: [ok, configured]
      properties:
        ok:
          type: boolean
        configured:
          type: boolean
    HTTPError:
      type: object
      required: [detail]
      properties:
        detail:
          type: string
    ValidationError:
      type: object
      required: [loc, msg, type]
      properties:
        loc:
          type: array
          items: {}
        msg:
          type: string
        type:
          type: string
    HTTPValidationError:
      type: object
      properties:
        detail:
          type: array
          items:
            $ref: '#/components/schemas/ValidationError'
tags:
  - name: system
    description: Process health and configuration visibility.
  - name: chat
    description: Policy question answering.
